name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependency audit (pip-audit + npm audit)
        run: bash scripts/dependency_audit.sh

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dev dependencies
        run: pip install -e "backend[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pre-commit (all hooks)
        run: pre-commit run --all-files

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev dependencies
        run: pip install -e "backend[dev]"

      - name: Ruff
        run: ruff check backend/app backend/tests

      - name: Ruff format
        run: ruff format --check backend/app backend/tests

      - name: Mypy
        run: mypy --config-file=backend/pyproject.toml backend/app

      - name: Cookie jar not tracked
        run: bash scripts/check_cookies_not_tracked.sh

      - name: Pytest
        env:
          # Match backend/.env.example so outreach settings validate in CI
          OUTREACH_ENABLED: "true"
          OUTREACH_PHYSICAL_ADDRESS: "123 Main St, Suite 100, San Francisco, CA 94105"
        run: pytest backend/tests -m "not postgres" -q --cov=app --cov-report=term-missing

      - name: Verify formal ADRs
        run: python backend/scripts/verify_adrs.py --json

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend for OpenAPI export
        run: pip install -e "backend[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify OpenAPI-generated types are up to date
        working-directory: frontend
        run: npm run openapi:check

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  # Mocked Playwright (chromium only). product-doors-t4.spec.ts lives under
  # e2e/integration and needs a live backend + auth setup — not in this job.
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-contract]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Mocked desk a11y e2e
        working-directory: frontend
        env:
          FRONTEND_USE_MOCKS: "true"
          CI: "true"
          PLAYWRIGHT_PORT: "3100"
        run: npx playwright test e2e/desk-states-a11y.spec.ts --project=chromium

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [lint-test, frontend-contract, frontend-e2e, dependency-audit, pre-commit]
    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: |
          make setup && make up
        env:
          POSTGRES_PASSWORD: change-me

      - name: Postgres logs on stack failure
        if: failure()
        run: cd backend/docker && docker compose logs postgres || true

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 5
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Smoke test
        run: make smoke

      - name: Tear down stack
        if: always()
        run: make down
