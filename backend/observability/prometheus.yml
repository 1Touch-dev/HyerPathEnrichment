global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/hyrepath.rules.yml

scrape_configs:
  - job_name: hyrepath-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["api:8000"]
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
