[project]
name = "hyrepath-enrichment-backend"
version = "0.1.0"
description = "Production-ready enrichment backend for Hyrepath Enrichment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<9.0",
  "rq>=1.16,<3.0",
  "rq-scheduler>=0.13,<1.0",
  "prometheus-client>=0.20,<1.0",
  "mailchecker>=6.0,<7.0",
  "sentry-sdk[fastapi]>=2.0,<3.0",
  "sendgrid>=6.11,<7.0",
  "email-validator>=2.0,<3.0",
  "fastapi-users[sqlalchemy]>=13.0,<14.0",
  "httpx-oauth>=0.15,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt>=4.0,<5.0",
  "slowapi>=0.1.9,<1.0",
  "tiktoken>=0.7,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "openai>=1.0,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "pgvector>=0.3,<1.0",
  "pydub>=0.25,<1.0",
  "pywebpush>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=5.0,<8.0",
  "mypy>=1.10,<3.0",
  "ruff>=0.5,<1.0",
  # LinkedIn unit tests import selenium-backed modules at collection time
  "selenium>=4.21,<5.0",
  "requests>=2.31,<3.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<5.0",
]
# Real enricher backends (Phase 1/2/3). All are lazily imported / shelled out
# so the app degrades gracefully when a tool is absent; install for production.
enrichers = [
  "dnspython>=2.6,<3.0",
  "playwright>=1.50.0,<2.0",
  "greenlet>=3.1.1,<4.0",
  "python-jobspy>=1.1,<2.0",
  "selenium>=4.21,<5.0",
  "aioboto3>=13.0,<16.0",
  # Tier 2 CLIs (sherlock / maigret entry points on PATH)
  "sherlock-project>=0.16.0,<0.17",
  "maigret>=0.6.2,<0.7",
  # Tier 3 — CrossLinked installed from GitHub fork in Dockerfiles (Yahoo search)
  # theHarvester is installed from GitHub in Dockerfiles
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "postgres: requires TEST_DATABASE_URL pointing at PostgreSQL",
]

[tool.ruff]
line-length = 100

'target-version' = "py312"

[tool.ruff.lint]
ignore = [
  "BLE001",  # Blind exception catches are intentional for fail-soft behavior
  "UP046",   # Generic class type parameters not yet adopted
  "UP047",   # Function type parameters not yet adopted
  "G201",    # logger.error with exc_info=True is preferred over logger.exception in some contexts
  "SIM102",  # Nested if statements are sometimes clearer
  "SIM103",  # Explicit if-else is sometimes clearer than returning condition directly
  "SIM117",  # Nested with statements are sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # Imports must come after environment setup

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
strict = true
# Prefer per-module overrides below over a blanket ignore_missing_imports.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "redis.*",
  "rq.*",
  "rq_scheduler.*",
  "aioboto3.*",
  "selenium.*",
  "jobspy.*",
  "dns.*",
  "playwright.*",
  "langfuse",
  "MailChecker",
  "sendgrid",
  "sendgrid.*",
  "fastapi_users.*",
  "httpx_oauth.*",
  "jose.*",
  "passlib.*",
  "slowapi.*",
  "fitz",
  "docx",
  "tiktoken",
  "langchain_text_splitters",
  "pywebpush",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = false
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_empty = true
