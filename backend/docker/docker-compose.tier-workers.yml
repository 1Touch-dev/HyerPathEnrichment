# Tier-specific worker pools with dedicated concurrency levels
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tier-workers.yml up -d
# Scale: docker compose -f ... scale worker-tier1=2 worker-tier234=8

services:
  # Tier 1 workers: Heavy browser automation (1-2 instances)
  # Requires: docker-compose.tier1.yml for Multilogin configuration
  worker-tier1:
    extends:
      file: docker-compose.yml
      service: worker
    env_file:
      - ${WORKER_ENV_FILE:-../.env}
    environment:
      # Queue routing configuration
      WORKER_QUEUE_MODE: per_tier
      WORKER_TARGET_QUEUE: tier1
      # Enable Tier 1 LinkedIn photo scraping
      ENABLE_TIER1: "true"
      # Use DATABASE_URL from env_file instead of docker-compose.prod.yml override
      DATABASE_URL: ${DATABASE_URL}
      # Inherit all tier1 settings from docker-compose.tier1.yml when stacked
    deploy:
      replicas: 2  # Low concurrency for browser automation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('${REDIS_URL}'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Tier 2-4 workers: Lightweight API enrichers (scalable to N instances)
  # Uses host network mode to enable external proxy connectivity (Oxylabs)
  worker-tier234:
    network_mode: host
    extends:
      file: docker-compose.yml
      service: worker
    env_file:
      - ${WORKER_ENV_FILE:-../.env}
    environment:
      # Queue routing configuration
      WORKER_QUEUE_MODE: per_tier
      WORKER_TARGET_QUEUE: tier234
      # Disable heavy tier1 dependencies
      ENABLE_TIER1: "false"
      # Host network mode requires 127.0.0.1 instead of service names
      DATABASE_URL: postgresql+asyncpg://hyrepath:psjjssjsjndj479987ffhudfui@127.0.0.1:5432/hyrepath
      REDIS_URL: redis://127.0.0.1:6379
      # Delay between each worker startup (in seconds)
      WORKER_STARTUP_DELAY: ${WORKER_STARTUP_DELAY:-10}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('redis://127.0.0.1:6379'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
