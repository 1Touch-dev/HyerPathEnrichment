# Production overlay — use with base compose:
#   cd backend/docker
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required host env (or ../.env.production via --env-file):
#   API_TOKEN, DATABASE_URL, REDIS_URL
#
# Tier 1 worker secrets: set WORKER_ENV_FILE=/etc/hyrepath/worker.env and use
#   -f docker-compose.tier-workers.yml (+ -f docker-compose.multilogin.yml on Linux)
#   for the supported production topology when ENABLE_TIER1=true.
#
# TLS terminates at the reverse proxy (see docs/deployment.md); API listens HTTP :8000.
#
# NOTE: Compose merges `ports:` lists across -f files by concatenation, not
# override — a bare `ports:` here would ADD to docker-compose.yml's mapping
# instead of replacing it (api would then try to bind both 0.0.0.0:8000 and
# 127.0.0.1:8000, which self-conflicts and fails to start). The `!override`
# merge tag (Compose spec, Docker Compose v2.24+) forces a real replace.

services:
  migrate:
    environment:
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath

  api:
    env_file:
      - ${API_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: production
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      # Bridge network: use service names
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      ENABLE_BILLING: ${ENABLE_BILLING:-false}
      STRIPE_MODE: ${STRIPE_MODE:-live}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-}
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    env_file:
      - ${WORKER_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: production
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      # Bridge network: use service names
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      EMAIL_VERIFIER_URL: http://email-verifier:8080
      SOCIAL_ANALYZER_URL: http://social-analyzer:9005
      GMAPS_SCRAPER_URL: http://google-maps-scraper:8080
    restart: unless-stopped

  postgres:
    # Keep the base host port (5433) but force a real override so Compose
    # doesn't merge this with docker-compose.yml and bind both 5433 and 5432.
    ports: !override
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hyrepath}
    restart: unless-stopped

  redis:
    # Tier 1 host-network workers reach Redis via 127.0.0.1 on Linux.
    ports: !override
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  social-analyzer:
    ports: !override
      - "127.0.0.1:9005:9005"
    restart: unless-stopped

  google-maps-scraper:
    ports: !override
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  email-verifier:
    ports: !override
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
