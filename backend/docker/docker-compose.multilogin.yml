# Linux bare-metal / cloud server overlay — containerised Multilogin
# ============================================================================
# Use this overlay on a bare Linux host (EC2, VPS, dedicated server).
# DO NOT use on Windows / WSL2 / Docker Desktop — host networking behaves
# differently there and the loopback trick only works on Linux.
#
# Usage (supported production path only):
#   Prefer: bash backend/scripts/start_production.sh --with-linux-mlx
#   Manual equivalent:
#     cd backend/docker
#     docker compose \
#         -f docker-compose.yml \
#         -f docker-compose.prod.yml \
#         -f docker-compose.foundation.yml \
#         -f docker-compose.tier-workers.yml \
#         -f docker-compose.multilogin.yml \
#         --env-file ../.env.production \
#         up -d migrate api redis postgres social-analyzer google-maps-scraper email-verifier \
#           worker worker-email worker-cleanup worker-job-matching worker-tier234 worker-tier1 multilogin
#
# Do not combine this file with docker-compose.tier1.yml. The supported Linux
# topology is tier-workers + multilogin, where worker-tier1 alone shares the
# host loopback with Multilogin and the bridge-network worker handles the
# already-built non-tier queues.
#
# How it works
# ─────────────
# Multilogin binds its per-profile Selenium debug port to 127.0.0.1 only.
# With network_mode: host, both the multilogin container and the RQ worker
# container share the Linux host's network namespace — they see the same
# 127.0.0.1 loopback, so the Selenium port is reachable without any hostname
# mapping or TCP proxy.  See ADR 0008 (docs/adr/0008-tier1-linux-host-network.md).
#
# Prerequisites
# ─────────────
# 1. AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY in the compose `--env-file`
#    (normally `backend/.env.production`). These are build-time only and are
#    used to pull mlxapp.deb from S3; AWS_SESSION_TOKEN is optional for
#    temporary credentials.
# 2. MULTILOGIN_EMAIL / MULTILOGIN_PASSWORD / MULTILOGIN_FOLDER_ID set in the worker env file.
# 3. LINKEDIN_BOT_EMAIL / LINKEDIN_BOT_PASSWORD set in the worker env file.
# 4. R2_* credentials and BROWSER_MODE=multilogin for the effective worker-tier1 runtime.
# ============================================================================

services:
  multilogin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.multilogin
      args:
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
        - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    container_name: hyrepath-multilogin
    # Shares the Linux host's 127.0.0.1 with the worker container.
    network_mode: host
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - multilogin_data:/home/mlxuser/mlx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sk --connect-timeout 5 https://127.0.0.1:45001/api/v1/version > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # This override only makes sense when docker-compose.tier-workers.yml is also
  # loaded. It intentionally targets worker-tier1 (not the generic worker) so
  # the supported Linux MLX topology has exactly one host-network Tier 1 worker.
  worker-tier1:
    depends_on:
      multilogin:
        condition: service_healthy
volumes:
  multilogin_data:
