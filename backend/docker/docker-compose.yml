services:
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
    command: ["/bin/bash", "/app/backend/docker/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      APP_NAME: ${APP_NAME:-Hyrepath Enrichment Backend}
      APP_ENV: ${APP_ENV:-development}
      API_TOKEN: ${API_TOKEN:-change-me}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      # Worker queue routing - must match tier-workers configuration
      WORKER_QUEUE_MODE: ${WORKER_QUEUE_MODE:-per_tier}
      # Free-mode sidecars (default-on). Enrichers degrade to empty fragments
      # if these are unreachable, so this stays safe if a sidecar is skipped.
      SOCIAL_ANALYZER_URL: http://social-analyzer:9005
      GMAPS_SCRAPER_URL: http://google-maps-scraper:8080
      ENABLE_TIER1: "false"
      # LLM disambiguation (default stub = free, no network). Flip LLM_MODE and
      # start `--profile llm` when using the LiteLLM proxy.
      # For ${LLM_*} substitution from backend/.env:
      #   docker compose --env-file ../.env --profile llm up
      LLM_MODE: ${LLM_MODE:-stub}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
      LITELLM_FALLBACKS: ${LITELLM_FALLBACKS:-}
      DISAMBIGUATION_THRESHOLD: ${DISAMBIGUATION_THRESHOLD:-0.7}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # Tier 4 job source: jobspy (free scraping) | jsearch (paid RapidAPI, reliable)
      JOB_SOURCE_PROVIDER: ${JOB_SOURCE_PROVIDER:-jobspy}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      JSEARCH_API_HOST: ${JSEARCH_API_HOST:-jsearch.p.rapidapi.com}
      JSEARCH_NUM_PAGES: ${JSEARCH_NUM_PAGES:-1}
      JSEARCH_TIMEOUT_SECONDS: ${JSEARCH_TIMEOUT_SECONDS:-20.0}
      # Tier 3 â€” OSINT + email (free default-on sidecar + worker CLIs)
      GITRECON_SCRIPT: /opt/gitrecon/gitrecon.py
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EMAIL_SLEUTH_BIN: email-sleuth
      EMAIL_VERIFIER_URL: http://email-verifier:8080
      EMAIL_VERIFY_LEVEL: ${EMAIL_VERIFY_LEVEL:-basic}
      EMAIL_VERIFY_MAX_PER_JOB: ${EMAIL_VERIFY_MAX_PER_JOB:-10}
      EMAIL_VERIFY_SMTP_DELAY_SECONDS: ${EMAIL_VERIFY_SMTP_DELAY_SECONDS:-6}
      REACHER_URL: ${REACHER_URL:-}
      REACHER_FROM_EMAIL: ${REACHER_FROM_EMAIL:-}
      PROXY_MODE: ${PROXY_MODE:-none}
      SCRAPOXY_URL: ${SCRAPOXY_URL:-}
      CROSSLINKED_SEARCH_ENGINES: ${CROSSLINKED_SEARCH_ENGINES:-yahoo}
      CROSSLINKED_TIMEOUT_SECONDS: ${CROSSLINKED_TIMEOUT_SECONDS:-120}
      # Change signals (changedetection.io → API → optional NOTIFY_WEBHOOK_URL)
      CHANGEDETECTION_URL: ${CHANGEDETECTION_URL:-http://changedetection:5000}
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      ENABLE_ERROR_TRACKING_PROBE: ${ENABLE_ERROR_TRACKING_PROBE:-false}
      # Email service (SendGrid)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-true}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@hyrepath.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Hyrepath Enrichment}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-support@hyrepath.com}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED:-true}
      OUTREACH_PHYSICAL_ADDRESS: ${OUTREACH_PHYSICAL_ADDRESS:-}
      # OpenAI API for embeddings (document search)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Admin Module: RBAC, audit log, feature flags, cached aggregates, MFA, impersonation
      ADMIN_AUDIT_LOG_RETENTION_DAYS: ${ADMIN_AUDIT_LOG_RETENTION_DAYS:-1825}
      ADMIN_AGGREGATE_CACHE_TTL_SECONDS: ${ADMIN_AGGREGATE_CACHE_TTL_SECONDS:-300}
      ADMIN_DEFAULT_PAGE_SIZE: ${ADMIN_DEFAULT_PAGE_SIZE:-20}
      ADMIN_MAX_PAGE_SIZE: ${ADMIN_MAX_PAGE_SIZE:-100}
      ADMIN_MFA_ISSUER_NAME: ${ADMIN_MFA_ISSUER_NAME:-Hyrepath Admin}
      ADMIN_IMPERSONATION_MAX_DURATION_MINUTES: ${ADMIN_IMPERSONATION_MAX_DURATION_MINUTES:-30}
      PROMETHEUS_QUERY_URL: ${PROMETHEUS_QUERY_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # Readiness (Postgres + Redis + Alembic head) — matches docs/deployment.md /ready probe
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    extra_hosts:
      - "host.docker.internal:${MULTILOGIN_HOST_IP:-host-gateway}"
    environment:
      APP_NAME: ${APP_NAME:-Hyrepath Enrichment Backend}
      APP_ENV: ${APP_ENV:-development}
      API_TOKEN: ${API_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      SOCIAL_ANALYZER_URL: http://social-analyzer:9005
      GMAPS_SCRAPER_URL: http://google-maps-scraper:8080
      # Tier 1 (LinkedIn photo) runs on the worker only â€” never enable on api.
      ENABLE_TIER1: ${ENABLE_TIER1:-false}
      BROWSER_MODE: ${BROWSER_MODE:-local}
      MULTILOGIN_SELENIUM_HOST: ${MULTILOGIN_SELENIUM_HOST:-http://host.docker.internal}
      LLM_MODE: ${LLM_MODE:-stub}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
      LITELLM_FALLBACKS: ${LITELLM_FALLBACKS:-}
      DISAMBIGUATION_THRESHOLD: ${DISAMBIGUATION_THRESHOLD:-0.7}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # Tier 4 job source: jobspy (free scraping) | jsearch (paid RapidAPI, reliable)
      JOB_SOURCE_PROVIDER: ${JOB_SOURCE_PROVIDER:-jobspy}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      JSEARCH_API_HOST: ${JSEARCH_API_HOST:-jsearch.p.rapidapi.com}
      JSEARCH_NUM_PAGES: ${JSEARCH_NUM_PAGES:-1}
      JSEARCH_TIMEOUT_SECONDS: ${JSEARCH_TIMEOUT_SECONDS:-20.0}
      GITRECON_SCRIPT: /opt/gitrecon/gitrecon.py
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EMAIL_SLEUTH_BIN: email-sleuth
      EMAIL_VERIFIER_URL: http://email-verifier:8080
      EMAIL_VERIFY_LEVEL: ${EMAIL_VERIFY_LEVEL:-basic}
      EMAIL_VERIFY_MAX_PER_JOB: ${EMAIL_VERIFY_MAX_PER_JOB:-10}
      EMAIL_VERIFY_SMTP_DELAY_SECONDS: ${EMAIL_VERIFY_SMTP_DELAY_SECONDS:-6}
      REACHER_URL: ${REACHER_URL:-}
      REACHER_FROM_EMAIL: ${REACHER_FROM_EMAIL:-}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED:-true}
      OUTREACH_PHYSICAL_ADDRESS: ${OUTREACH_PHYSICAL_ADDRESS:-}
      PROXY_MODE: ${PROXY_MODE:-none}
      SCRAPOXY_URL: ${SCRAPOXY_URL:-}
      CROSSLINKED_SEARCH_ENGINES: ${CROSSLINKED_SEARCH_ENGINES:-yahoo}
      CROSSLINKED_TIMEOUT_SECONDS: ${CROSSLINKED_TIMEOUT_SECONDS:-120}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      # OpenAI API for embeddings (document search) and feedback generation
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_STARTUP_DELAY: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - tier1_artifacts:/app/backend/artifacts/tier1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.workers.queue import get_redis_connection; get_redis_connection().ping()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: hyrepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hyrepath
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U hyrepath -d hyrepath && psql -U hyrepath -d hyrepath -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  # ── Free-mode sidecars (default-on) ─────────────────────────────
  # AGPL tools stay isolated behind HTTP; never imported into app/.
  social-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.social-analyzer
    ports:
      - "9005:9005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9005/get_settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
  # Built via Dockerfile.google-maps-scraper: upstream binary + Playwright
  # 1.57.0 driver from npm/nodejs.org (Hub :latest 404s on retired CDN).
  # Do not mount a volume over /opt â€” that shadows /opt/node and /opt/package.
  google-maps-scraper:
    build:
      context: .
      dockerfile: Dockerfile.google-maps-scraper
    command: ["-web", "-addr", "0.0.0.0:8080", "-data-folder", "/gmapsdata"]
    ports:
      - "8080:8080"
    volumes:
      - gmaps_data:/gmapsdata
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/docs"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
  email-verifier:
    build:
      context: .
      dockerfile: Dockerfile.email-verifier
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/v1/health@example.com/verification",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # Email worker — processes email queue via SendGrid API
  worker-email:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      APP_NAME: ${APP_NAME:-Hyrepath Enrichment Backend}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@hyrepath.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Hyrepath Enrichment}
      SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-support@hyrepath.com}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED:-true}
      OUTREACH_PHYSICAL_ADDRESS: ${OUTREACH_PHYSICAL_ADDRESS:-}
      WORKER_STARTUP_DELAY: "0"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    command: ["rq", "worker", "email", "--url", "redis://redis:6379/0"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.workers.queue import get_redis_connection; get_redis_connection().ping()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Cleanup worker — finds and fixes orphaned jobs
  worker-cleanup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      APP_NAME: ${APP_NAME:-Hyrepath Enrichment Backend}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+asyncpg://hyrepath:${POSTGRES_PASSWORD}@postgres:5432/hyrepath
      REDIS_URL: redis://redis:6379/0
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      OUTREACH_ENABLED: ${OUTREACH_ENABLED:-true}
      OUTREACH_PHYSICAL_ADDRESS: ${OUTREACH_PHYSICAL_ADDRESS:-}
      WORKER_STARTUP_DELAY: "0"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    command: ["python", "-m", "app.workers.cleanup_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.workers.queue import get_redis_connection; get_redis_connection().ping()",
        ]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

  # â”€â”€ Paid / heavy services (opt-in via `--profile`) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Free-mode `docker compose up` never launches these. Flip the matching
  # provider mode flag AND start the profile when you pay.
  reacher:
    image: reacherhq/backend:latest
    profiles: ["paid"]
    ports:
    - "8082:8080"
    environment:
      RCH_HTTP_HOST: 0.0.0.0
    restart: unless-stopped
  litellm:
    # Do NOT env_file the whole backend/.env â€” it injects Hyrepath DATABASE_URL
    # (sqlite) and crash-loops the proxy. Pass vendor keys via compose
    # --env-file ../.env interpolation only. Chat completions need no LiteLLM DB.
    # Newer proxy images require an explicit model_list (see litellm_config.yaml).
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["llm", "paid"]
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Only set LITELLM_MASTER_KEY in .env if you want proxy auth; an empty
      # value still enables "api key required" and breaks unauthenticated curls.
      # LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  scrapoxy:
    image: scrapoxy/scrapoxy:latest
    profiles: ["paid"]
    restart: unless-stopped
  # NOTE: langfuse (v3) needs its own datastore stack; kept behind a profile so
  # a plain `docker compose up` stays light. LLMProvider.trace() is a no-op
  # until LANGFUSE_* is set, so free mode runs without it.
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    environment:
      # Dedicated DB — do not share the app schema (hyrepath).
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql://hyrepath:hyrepath@postgres:5432/langfuse}
      NEXTAUTH_SECRET: change-me
      SALT: change-me
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    restart: unless-stopped
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    profiles: ["observability"]
    environment:
      PORT: "5000"
      BASE_URL: ${CHANGEDETECTION_PUBLIC_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - changedetection_data:/datastore
    restart: unless-stopped
  # Self-hosted Sentry-compatible error tracking. SDK is no-op until SENTRY_DSN is set.
  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.1.5
    profiles: ["observability"]
    command: ./manage.py migrate
    environment: &glitchtip-env
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgresql://hyrepath:psjjssjsjndj479987ffhudfui@postgres:5432/glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret}
      PORT: "8000"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_PUBLIC_URL:-http://localhost:8001}
      REDIS_URL: redis://redis:6379/1
      ENABLE_USER_REGISTRATION: "true"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
  glitchtip-web:
    image: glitchtip/glitchtip:v4.1.5
    profiles: ["observability"]
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      # v4.1.5 predates /code/healthcheck.py (added in later glitchtip images),
      # so hit the web root with stdlib urllib instead (curl isn't in this image).
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').status\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1.5
    profiles: ["observability"]
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  tier1_artifacts:
  ollama_data:
  changedetection_data:
  gmaps_data:
